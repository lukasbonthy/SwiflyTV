name: Check SwiflyTV

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-check:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run test:ui
      - run: npm run prepare:ai
      - run: npm run test:recommendations
      - run: node node_modules/playwright-core/cli.js install chromium
      # Bound Chromium concurrency so display-clock checks do not compete with every suite at once.
      - run: node --test --test-concurrency=2 tests/access-screen.test.cjs tests/details-fluidity-rendering.test.cjs tests/glass-rendering.test.cjs tests/glass-reference.test.cjs tests/glass-integrity.test.cjs tests/hero-glass-backdrop.test.cjs tests/scroll-rendering.test.cjs tests/premium-scroll-rendering.test.cjs tests/resume-browser.test.cjs tests/page-transitions-rendering.test.cjs tests/tv-player-rendering.test.cjs tests/tv-rendering.test.cjs tests/tv-xbox-rendering.test.cjs tests/watchroom-call-rendering.test.cjs tests/party-calls-layout.test.cjs tests/connected-cinema-rendering.test.cjs tests/search-studio-rendering.test.cjs tests/player-layout.test.cjs tests/player-studio-browser.test.cjs tests/studio-workspace-browser.test.cjs tests/browser-conditions.test.cjs tests/studio-text-scale-browser.test.cjs tests/studio-experience-browser.test.cjs tests/study-browser.test.cjs tests/feed-browser.test.cjs tests/library-browser.test.cjs tests/trakt-rendering.test.cjs tests/account-backup-browser.test.cjs tests/appearance-wallpaper-browser.test.cjs tests/tv-native-controller-browser.test.cjs tests/source-4k-browser.test.cjs
      - run: npm run test:acceptance
