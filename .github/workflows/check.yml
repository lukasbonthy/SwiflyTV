name: Check SwiflyTV

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run test:ui
      - run: node node_modules/playwright-core/cli.js install chromium
      - run: node --test tests/glass-rendering.test.cjs tests/glass-reference.test.cjs tests/glass-integrity.test.cjs tests/scroll-rendering.test.cjs tests/premium-scroll-rendering.test.cjs tests/resume-browser.test.cjs tests/page-transitions-rendering.test.cjs tests/tv-player-rendering.test.cjs
