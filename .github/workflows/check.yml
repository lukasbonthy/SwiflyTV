name: Check SwiflyTV

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - run: npm run check
